name: CI

on:
  push:
    branches: [main, dc-use]
  pull_request:
    branches: [main, dc-use]

permissions:
  contents: read

jobs:
  ci:
    name: Test, Build & Smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./cmd/... ./internal/...

      - name: Check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: tools/testcoverage.yml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Upload coverage to Codecov
        # An external-token upload: it runs only where its token exists. Without
        # CODECOV_TOKEN (dependabot, or a fork that never configured one) the step
        # is NOT EXECUTED — never reported green, and never a failure of the tests.
        if: env.CODECOV_TOKEN != ''
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unittests
          name: helm-semver
          fail_ci_if_error: true

      - name: Build
        run: make build

      - name: Smoke tests (e2e, no external services)
        run: go test ./e2e/ -v -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  # The integration branch requires a status check named `ci`. GitHub reports a
  # check under the job's display name, and the jobs above keep upstream's names,
  # so this job carries the required name and passes only when both of them do.
  required:
    name: ci
    runs-on: ubuntu-latest
    needs: [ci, lint]
    steps:
      - run: echo "Test, Build & Smoke and Lint passed"
