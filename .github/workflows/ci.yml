name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # The check run must be named exactly `ci`: the main-branch ruleset
    # requires that status check, and a renamed job can never satisfy it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The codecov action verifies its binary with gpg; the runner image
      # does not carry it, so the supply-chain check installs it here.
      - name: Install gpg for the codecov binary verification
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnupg

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./cmd/... ./internal/...

      - name: Check test coverage
        uses: vladopajic/go-test-coverage@v2
        with:
          config: tools/testcoverage.yml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Upload coverage to Codecov
        # Skip for dependabot PRs — they cannot access secrets. The upload is
        # telemetry: the quality gate on coverage is the go-test-coverage step
        # above, so a wrapper/runner mismatch (v7 requires gpg on PATH in a way
        # even the preinstalled runner image fails to satisfy) must not fail CI.
        if: github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unittests
          name: helm-semver
          fail_ci_if_error: false

      - name: Build
        run: make build

      - name: Smoke tests (e2e, no external services)
        run: go test ./e2e/ -v -count=1

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
